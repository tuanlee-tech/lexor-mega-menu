# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Lexor Mega Menu"
application_url = "https://lexor-mega-menu.onrender.com"
embedded = true
client_id = "568f4388307e8ddc5d7f14306103a94a"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_online_store_navigation,read_products,read_content,read_files,write_files"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://lexor-mega-menu.onrender.com/api/auth",
  "https://lexor-mega-menu.onrender.com/auth/callback",
  "https://lexor-mega-menu.onrender.com/auth/shopify/callback",
  "https://lexor-mega-menu.onrender.com/api/auth/callback"
]
